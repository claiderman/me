name: Validate Astro project

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON resources
        run: node --input-type=module -e "import fs from 'node:fs'; for (const file of ['public/locales/es/common.json', 'public/locales/es/cv.json', 'public/locales/es/sections.json', 'public/locales/en/common.json', 'public/locales/en/cv.json', 'public/locales/en/sections.json']) JSON.parse(fs.readFileSync(file, 'utf8'));"

      - name: Lint code
        run: npm run lint

      - name: Typecheck Astro
        run: npm run typecheck

      - name: Build site
        run: npm run build